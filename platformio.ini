;******************************************************************************
; Trailer Controller
; PlatformIO Configuration
;
; Target: Arduino Mega 2560
; Framework: Arduino
;******************************************************************************

[platformio]
default_envs = mega2560

[env:mega2560]

; ---------------------------------------------------------------------------
; Platform
; ---------------------------------------------------------------------------

platform = atmelavr
board = megaatmega2560
framework = arduino

; ---------------------------------------------------------------------------
; Upload
; ---------------------------------------------------------------------------

upload_protocol = wiring
upload_speed = 115200

; ---------------------------------------------------------------------------
; Serial Monitor
; ---------------------------------------------------------------------------

monitor_speed = 115200

monitor_filters =
    time
    colorize

; ---------------------------------------------------------------------------
; Compiler
; ---------------------------------------------------------------------------

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wundef
    -D SERIAL_BAUD=115200

; ---------------------------------------------------------------------------
; Library Dependency Finder
; ---------------------------------------------------------------------------

lib_ldf_mode = chain+

; ---------------------------------------------------------------------------
; Unit Tests
; ---------------------------------------------------------------------------

test_framework = unity
test_build_src = false

; ---------------------------------------------------------------------------
; Build Options
; ---------------------------------------------------------------------------

check_tool = cppcheck

; ---------------------------------------------------------------------------
; Extra Directories
; ---------------------------------------------------------------------------

include_dir = include
src_dir = src
lib_dir = lib
test_dir = test
